<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기술적분석투자</title>
<meta name="theme-color" content="#18211c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="기술적분석투자">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Sans+KR:wght@600;700&family=Noto+Serif+KR:wght@600;800&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 한 칼럼. 종목 목록에서 상세로 들어가는 구조, 시장 단계는 항상 상단에 표시 */
:root{
  --bg:#f3f4f0; --surface:#ffffff; --ink:#17221d; --muted:#5f6b64; --line:#dfe3dc;
  --accent:#1f3a5f; --accent-ink:#ffffff; --ma:#b45309;
  --s1:#6b7a99; --s2:#1f8a5b; --s3:#c98a12; --s4:#c2412d;
  --font-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-display:'Noto Serif KR','Batang',serif;
  --font-title:'IBM Plex Sans KR','Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1512; --surface:#18201c; --ink:#e8eee9; --muted:#97a59c; --line:#2a3530;
    --accent:#9db8e8; --accent-ink:#0f1512; --ma:#f5a524;
    --s1:#8d9bb8; --s2:#3ec28a; --s3:#e8b040; --s4:#ef6a55;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18201c; --ink:#e8eee9; --muted:#97a59c; --line:#2a3530;
  --accent:#9db8e8; --accent-ink:#0f1512; --ma:#f5a524;
  --s1:#8d9bb8; --s2:#3ec28a; --s3:#e8b040; --s4:#ef6a55;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.35;-webkit-text-size-adjust:100%}
.wrap{max-width:none;width:100%;margin:0;padding:6px 6px 24px;overflow-x:hidden}
.wrap .card,.wrap .tile,.wrap .row>span,.wrap .hero>div,.wrap .checks li>div,.wrap .candhead>div,.wrap .resrow>.reslist{min-width:0}
.btn,.chip,.sig,.tag,.pill,.mkt,.tabs button{white-space:normal;overflow-wrap:anywhere;word-break:keep-all;text-align:center;line-height:1.25;max-width:100%}
.btn,.chip{display:inline-flex;align-items:center;justify-content:center}
.sig{box-sizing:border-box;padding:2px 8px}
.row .name,.row .sub,.tile b,.tile em,.tile small{overflow-wrap:anywhere}
.row .right{max-width:48%}
.mkt{white-space:normal}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* 상단 */
.apptitle{font-family:'Noto Sans KR',var(--font-title);font-weight:900;font-size:34px;line-height:1.15;letter-spacing:-.04em;text-align:center;margin:2px 0 8px;overflow-wrap:anywhere}
@media (max-width:420px){.apptitle{font-size:30px}}
.top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:4px 10px;margin-bottom:6px}
.top h1{font-family:var(--font-title);font-weight:700;font-size:24px;line-height:1.1;letter-spacing:-.035em;white-space:nowrap}
.top p{margin:0;color:var(--muted);font-size:12px}
.mkt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 8px 2px 4px;display:flex;align-items:center;gap:8px;font-size:13px}
.mkt .dot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;font-family:var(--font-mono)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:8px;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:0}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;font-size:13px;padding:4px 2px;flex:1;min-height:36px;font-weight:500;color:var(--muted)}
.tabs.sub{margin-top:-4px}
.tabs.sub button{font-size:12.5px;min-height:30px;font-weight:400}
.tabs.main button{font-size:14px}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}

/* 색 */
.s1{--c:var(--s1)} .s2{--c:var(--s2)} .s3{--c:var(--s3)} .s4{--c:var(--s4)}
.sig.buy{--c:var(--s2)} .sig.watch{--c:var(--accent)} .sig.hold{--c:var(--s2)} .sig.hot{--c:var(--s3)}
.sig.wait{--c:var(--s1)} .sig.reduce{--c:var(--s3)} .sig.avoid{--c:var(--s4)}
.sig{display:inline-block;border:1px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface));border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:700}
.sig.buy{background:var(--c);color:#fff}

/* 버튼 */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;min-height:34px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--s4)}
.btn.small{min-height:30px;padding:3px 8px;font-size:13px}
.bar{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 8px}

/* 목록 */
.summary{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px;font-size:13px;color:var(--muted)}
.summary span{display:inline-flex;align-items:center;gap:6px}
.summary i{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block}
.list{display:flex;flex-direction:column;gap:4px}
.row{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:4px 8px}
.row:hover{border-color:var(--c)}
.badge{width:26px;height:26px;border-radius:8px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--font-mono);font-weight:500;font-size:15px}
.row .name{font-weight:700;display:block}
.row .sub{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.row .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row svg{display:block}
.tag{font-size:11px;border:1px dashed var(--muted);color:var(--muted);border-radius:4px;padding:0 5px;margin-left:6px;font-weight:500;vertical-align:middle}

/* 상세 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;border-left:6px solid var(--c)}
.hero .big{font-family:var(--font-display);font-weight:800;font-size:40px;line-height:1;color:var(--c);min-width:54px;text-align:center}
.hero .big small{display:block;font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--muted);margin-top:4px}
.hero h2{font-size:16px;margin-bottom:2px}
.hero p{margin:3px 0 0;color:var(--muted);font-size:13px}
.chartwrap{position:relative}
canvas{display:block;width:100%;touch-action:pan-y}
#c-main{height:210px}
#c-rs{height:80px}
.tip{position:absolute;left:8px;top:6px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;pointer-events:none;display:none;font-family:var(--font-mono)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;background:var(--c)}
.legend i.box{height:10px;width:10px;opacity:.5}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.tile small{display:block;color:var(--muted);font-size:12px}
.tile b{font-family:var(--font-mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.tile em{font-style:normal;font-size:12px;color:var(--muted);display:block}
h3{font-size:15px;margin-bottom:4px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.checks li{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:4px 0;border-top:1px solid var(--line);align-items:start}
.checks li:first-child{border-top:0}
.pill{font-size:12px;font-weight:700;border-radius:6px;padding:2px 0;text-align:center;border:1px solid var(--c);color:var(--c)}
.pill.pass{--c:var(--s2);background:color-mix(in srgb,var(--s2) 12%,var(--surface))}
.pill.fail{--c:var(--s4);background:color-mix(in srgb,var(--s4) 12%,var(--surface))}
.pill.warn{--c:var(--s3);background:color-mix(in srgb,var(--s3) 12%,var(--surface))}
.pill.unk{--c:var(--muted)}
.checks b{display:block;font-weight:500}
.checks span.d{font-size:13px;color:var(--muted)}
.score{font-family:var(--font-mono);font-size:13px;color:var(--muted);font-weight:400}

/* 폼 */
label{display:block;font-weight:500;margin:6px 0 2px;font-size:13px}
input[type=text],input[type=password],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
textarea{min-height:110px;font-family:var(--font-mono);font-size:12.5px;line-height:1.4}
.note{font-size:12px;color:var(--muted);margin:3px 0}
.err{color:var(--s4);font-size:14px;margin:10px 0;font-weight:500}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calcout{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:14px}
.calcout .num{font-weight:500}
.rules h3{margin-top:4px}
.rules p,.rules li{font-size:14px}
.rules ul{padding-left:18px;margin:6px 0}
.stgrid{display:grid;gap:8px;margin:8px 0 14px}
.stgrid div{border-left:5px solid var(--c);padding:6px 10px;background:var(--bg);border-radius:6px}
.stgrid b{font-family:var(--font-display)}
table.p{width:100%;border-collapse:collapse;font-size:13.5px}
table.p td{padding:6px 4px;border-top:1px solid var(--line)}
table.p td:last-child{text-align:right;font-family:var(--font-mono)}
.resrow{display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-top:1px solid var(--line)}
.resrow:first-of-type{border-top:0}
.reslist{display:flex;gap:6px;flex-wrap:wrap}
.mrow2>summary{display:flex;align-items:center;gap:6px;flex-wrap:wrap;list-style:none}
.mrow2>summary::-webkit-details-marker{display:none}
.why{list-style:none;margin:4px 0;padding:0}.why li{padding:3px 0;border-top:1px solid var(--line);font-size:13px}.why li:first-child{border-top:0}.why .d{display:block;color:var(--muted);font-size:12px}
.chips{margin:4px 0}
.mrow2 .mname{flex:1;min-width:0;overflow-wrap:anywhere}
.mrow2[open]>summary{margin-bottom:4px}
.rules2{padding-left:18px;margin:6px 0;font-size:13px}
.mrow{--c:var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0;min-height:0}
.sug .chip{cursor:pointer;color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:13px;min-height:32px}
.pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--font-mono);font-size:12px;margin:10px 0 0}
input[type=checkbox]{width:18px;height:18px;vertical-align:middle;margin-right:8px}
.candhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:6px}
.candhead b{font-size:16px}
.candnums{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:6px 0}
.candnums div{background:var(--bg);border-radius:6px;padding:2px 8px}
.candnums small{display:block;color:var(--muted);font-size:11.5px}
.candnums b{font-family:var(--font-mono);font-weight:500;font-size:14px}
a{color:var(--accent)}
.foot{font-size:11px;color:var(--muted);margin-top:8px}
details summary{cursor:pointer;font-weight:500;min-height:28px;display:flex;align-items:center}
.back{margin-bottom:6px}
@media (prefers-reduced-motion:no-preference){.row{transition:border-color .15s}}
@media (max-width:420px){.hero .big{font-size:32px}.top h1{font-size:22px}}
</style>

<body>
<div class="wrap" id="app"></div>

<script>
//#PURE-START
/* ===== 순수 로직 (DOM 없음) ===== */
const DAY=86400000;
function sma(arr,n){const out=new Array(arr.length).fill(null);let s=0;for(let i=0;i<arr.length;i++){s+=arr[i];if(i>=n)s-=arr[i-n];if(i>=n-1)out[i]=s/n;}return out;}
function parseNum(s){if(s==null)return NaN;const t=String(s).replace(/[,\s"'원$%]/g,'');if(t===''||t==='-')return NaN;return parseFloat(t);}
function parseDate(s){
  s=String(s).trim().replace(/^"|"$/g,'');
  let m=s.match(/^(\d{4})\D?(\d{1,2})\D?(\d{1,2})/);
  if(m){const ts=Date.UTC(+m[1],+m[2]-1,+m[3]);return isNaN(ts)||+m[2]>12||+m[3]>31?NaN:ts;}
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m){const ts=Date.UTC(+m[3],+m[1]-1,+m[2]);return isNaN(ts)||+m[1]>12?NaN:ts;}
  return NaN;
}
function weekKey(ts){const day=new Date(ts).getUTCDay();return ts-((day+6)%7)*DAY;}
function fmtDate(ts){return new Date(ts).toISOString().slice(0,10);}
function splitLine(line,delim){
  if(delim==='ws')return line.split(/\s+/);
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){const ch=line[i];
    if(ch==='"'){q=!q;continue;}
    if(ch===delim&&!q){out.push(cur);cur='';continue;}
    cur+=ch;}
  out.push(cur);return out.map(x=>x.trim());
}
function parseInput(text){
  const lines=String(text).replace(/\r/g,'').split('\n').map(s=>s.trim()).filter(Boolean);
  if(lines.length<2)throw new Error('데이터가 너무 적습니다. 날짜와 종가가 있는 표를 붙여넣어 주세요.');
  const f0=lines[0];
  const delim=f0.includes('\t')?'\t':f0.includes(';')?';':f0.includes(',')?',':'ws';
  const first=splitLine(f0,delim);
  const hasHeader=!first.some(x=>!isNaN(parseDate(x)));
  let iD=-1,iC=-1,iV=-1,iH=-1,iL=-1,start=0;
  if(hasHeader){
    start=1;
    const hd=first.map(x=>x.toLowerCase());
    iD=hd.findIndex(x=>/date|날짜|일자|일시|time/.test(x));
    iC=hd.findIndex(x=>x==='close'||x==='종가'||x==='현재가'||x==='종가(원)');
    if(iC<0)iC=hd.findIndex(x=>/adj/.test(x)&&/close/.test(x));
    if(iC<0)iC=hd.findIndex(x=>/close|종가/.test(x));
    iV=hd.findIndex(x=>/volume|거래량|vol\b/.test(x));
    iH=hd.findIndex(x=>/^high|고가/.test(x));
    iL=hd.findIndex(x=>/^low|저가/.test(x));
    if(iD<0)iD=0;
    if(iC<0)throw new Error('종가(Close) 열을 찾지 못했습니다. 첫 줄에 "날짜, 종가, 거래량" 같은 제목이 있어야 합니다.');
  }else{
    iD=first.findIndex(x=>!isNaN(parseDate(x)));
    const k=first.length-iD-1;
    const rel=({1:{c:1},2:{c:1,v:2},3:{c:1,v:2},4:{h:2,l:3,c:4},5:{h:2,l:3,c:4,v:5}})[k];
    if(!rel)throw new Error('열 구성을 알 수 없습니다. 첫 줄에 제목(날짜, 종가, 거래량 등)을 넣어 주세요.');
    iC=iD+rel.c;iV=rel.v!=null?iD+rel.v:-1;iH=rel.h!=null?iD+rel.h:-1;iL=rel.l!=null?iD+rel.l:-1;
    if(k===4){iC=iD+4;iH=iD+2;iL=iD+3;iV=-1;}
  }
  const raw=[];
  for(let i=start;i<lines.length;i++){
    const f=splitLine(lines[i],delim);
    const ts=parseDate(f[iD]);const c=parseNum(f[iC]);
    if(isNaN(ts)||isNaN(c)||c<=0)continue;
    const v=iV>=0?parseNum(f[iV]):0;
    let h=iH>=0?parseNum(f[iH]):NaN;let l=iL>=0?parseNum(f[iL]):NaN;
    raw.push({ts,c,v:isNaN(v)?0:v,h:isNaN(h)?c:h,l:isNaN(l)?c:l});
  }
  if(raw.length<10)throw new Error('읽은 행이 '+raw.length+'개뿐입니다. 날짜 형식(예: 2026-11-13)과 종가 열을 확인해 주세요.');
  return buildWeekly(raw);
}
function buildWeekly(raw){
  if(raw.length<10)throw new Error('시세가 '+raw.length+'개뿐입니다.');
  raw.sort((a,b)=>a.ts-b.ts);
  const gaps=[];for(let i=1;i<raw.length;i++)gaps.push((raw[i].ts-raw[i-1].ts)/DAY);
  gaps.sort((a,b)=>a-b);
  if(gaps[Math.floor(gaps.length/2)]>10)throw new Error('월봉처럼 간격이 긴 데이터입니다. 일봉 또는 주봉을 붙여넣어 주세요.');
  const map=new Map();
  for(const r of raw){
    const k=weekKey(r.ts);const w=map.get(k);
    if(!w)map.set(k,{d:k,h:r.h,l:r.l,c:r.c,v:r.v,_t:r.ts});
    else{w.h=Math.max(w.h,r.h);w.l=Math.min(w.l,r.l);if(r.ts>=w._t){w.c=r.c;w._t=r.ts;}w.v+=r.v;}
  }
  const rows=[...map.values()].sort((a,b)=>a.d-b.d).map(({d,h,l,c,v})=>({d,h,l,c,v}));
  if(rows.length<40)throw new Error('주봉으로 '+rows.length+'주치입니다. 30주 이동평균과 기울기를 보려면 최소 40주, 권장 60주 이상이 필요합니다.');
  return rows.slice(-400);
}

function toTs(v){
  if(typeof v==='number'){
    if(v>=1e11)return v;
    if(v>=1e9)return v*1000;
    v=String(Math.round(v));
  }
  return parseDate(String(v));
}
function findName(j){
  if(!j||typeof j!=='object')return '';
  for(const k of ['name','stockName','stock_name','hts_kor_isnm','itemName','korName']){if(typeof j[k]==='string'&&j[k].trim())return j[k].trim();}
  for(const k of ['output','info','meta','data']){if(j[k]&&typeof j[k]==='object'&&!Array.isArray(j[k])){const n=findName(j[k]);if(n)return n;}}
  return '';
}
function normHistory(json){
  let arr=Array.isArray(json)?json:null;
  const scan=o=>{for(const k in o){if(Array.isArray(o[k])&&o[k].length)return o[k];}return null;};
  if(!arr&&json&&typeof json==='object'){
    for(const k of ['rows','data','items','history','candles','prices','list','output2','result','output']){
      const v=json[k];
      if(Array.isArray(v)&&v.length){arr=v;break;}
      if(v&&typeof v==='object'&&!Array.isArray(v)){arr=scan(v);if(arr)break;}
    }
    if(!arr)arr=scan(json);
  }
  if(!arr||!arr.length)throw new Error('응답에서 시세 목록을 찾지 못했습니다.');
  const pick=(o,ns)=>{for(const n of ns){if(o[n]!=null&&o[n]!=='')return o[n];}return undefined;};
  const raw=[];
  for(const o of arr){
    let ts,c,h,l,v;
    if(Array.isArray(o)){
      if(o.length<6)continue;
      ts=toTs(o[0]);h=parseNum(o[2]);l=parseNum(o[3]);c=parseNum(o[4]);v=parseNum(o[5]);
    }else if(o&&typeof o==='object'){
      const d=pick(o,['date','d','day','time','t','ymd','stck_bsop_date','xymd','base_date','dt','x','localDate','tradeDate']);
      if(d===undefined)continue;
      ts=toTs(d);
      c=parseNum(pick(o,['close','c','clpr','stck_clpr','price','closePrice','last','종가']));
      h=parseNum(pick(o,['high','h','hgpr','stck_hgpr','highPrice','고가']));
      l=parseNum(pick(o,['low','l','lwpr','stck_lwpr','lowPrice','저가']));
      v=parseNum(pick(o,['volume','v','vol','acml_vol','trdVol','quantity','거래량']));
    }else continue;
    if(isNaN(ts)||isNaN(c)||c<=0)continue;
    raw.push({ts,c,v:isNaN(v)?0:v,h:isNaN(h)?c:h,l:isNaN(l)?c:l});
  }
  if(raw.length<10)throw new Error('읽을 수 있는 시세가 '+raw.length+'개뿐입니다.');
  return buildWeekly(raw);
}

const FLAT=1.5, EXT_OK=15, EXT_HOT=30, BRK_MIN=1.02, VOL_X=2;
function analyze(rows,bench,mktStage){
  const n=rows.length;
  if(n<40)return{err:'주봉 40개 이상이 필요합니다.'};
  const c=rows.map(r=>r.c),v=rows.map(r=>r.v),lo=rows.map(r=>r.l||r.c);
  const ma=sma(c,30);
  const hasVol=v.filter(x=>x>0).length>n*0.5;
  const brk=new Array(n).fill(null),fresh=new Array(n).fill(false);
  for(let i=26;i<n;i++){
    let hi=-Infinity;for(let j=i-26;j<i;j++)if(c[j]>hi)hi=c[j];
    if(c[i]>hi*BRK_MIN){let s=0,k=0;for(let j=Math.max(0,i-4);j<i;j++){s+=v[j];k++;}
      const av=k?s/k:0;brk[i]={hi,vr:(hasVol&&av>0)?v[i]/av:null};}
  }
  for(let i=0;i<n;i++){if(!brk[i])continue;let p=false;for(let j=Math.max(0,i-8);j<i;j++)if(brk[j]){p=true;break;}fresh[i]=!p;}
  function stageAt(i){
    if(i<39||ma[i]==null||ma[i-10]==null)return null;
    const s10=(ma[i]/ma[i-10]-1)*100,above=c[i]>ma[i];
    const prior=(ma[i]/ma[Math.max(29,i-40)]-1)*100;
    let rf=false;for(let j=Math.max(0,i-6);j<=i;j++)if(fresh[j]){rf=true;break;}
    if(above&&s10>FLAT)return 2;
    if(!above&&s10<-FLAT)return 4;
    if(above&&s10<-FLAT)return rf?1:4;
    if(above)return rf?2:(prior>5?3:1);
    if(s10>FLAT)return 3;
    return prior>5?3:1;
  }
  const stages=c.map((_,i)=>stageAt(i));
  const last=n-1,stage=stages[last];
  const s10=(ma[last]/ma[last-10]-1)*100,s4=(ma[last]/ma[last-4]-1)*100;
  const ext=(c[last]/ma[last]-1)*100;
  let weeksAbove=0;for(let i=last;i>=0&&ma[i]!=null&&c[i]>ma[i];i--)weeksAbove++;
  let hi52=-Infinity;for(let j=Math.max(0,last-52);j<last;j++)if(c[j]>hi52)hi52=c[j];
  const distHi=(hi52/c[last]-1)*100;
  let bo=null;for(let j=last;j>=Math.max(0,last-8);j--)if(fresh[j]){bo={weeksAgo:last-j,vr:brk[j].vr,hi:brk[j].hi,idx:j};break;}
  const lowRecent=Math.min(...lo.slice(last-9));
  const cands=[ma[last],lowRecent].filter(x=>x<c[last]);
  const stop=cands.length?Math.max(...cands):c[last]*0.92;
  const stopRef=stop===ma[last]?'30주선':(cands.length?'최근 10주 저점':'−8%');
  const riskPct=(c[last]-stop)/c[last]*100;
  let volTrend=null;
  if(hasVol){const a=v.slice(last-3).reduce((x,y)=>x+y,0)/4;const b=v.slice(last-29,last-3).reduce((x,y)=>x+y,0)/26;volTrend=b>0?a/b:null;}
  let rsArr=new Array(n).fill(null),rsNow=null,rsUp=null;
  if(bench){
    const bm=new Map(bench.map(r=>[r.d,r.c]));const ser=[];
    rows.forEach((r,i)=>{const b=bm.get(r.d);if(b)ser.push({i,v:r.c/b});});
    if(ser.length>=32){
      const vals=ser.map(s=>s.v),win=Math.min(52,Math.max(26,Math.floor(ser.length*0.8))),m=sma(vals,win);
      ser.forEach((s,k)=>{if(m[k]!=null)rsArr[s.i]=(vals[k]/m[k]-1)*10;});
      const idxs=rsArr.map((x,i)=>x!=null?i:-1).filter(i=>i>=0);
      if(idxs.length){rsNow=rsArr[idxs[idxs.length-1]];const pi=idxs[Math.max(0,idxs.length-5)];rsUp=rsNow>rsArr[pi];}
    }
  }
  const volOk=bo&&bo.vr!=null&&bo.vr>=VOL_X;
  const boLive=bo&&bo.weeksAgo<=4&&c[last]>bo.hi;
  const checks=[];
  const add=(k,label,st,detail)=>checks.push({k,label,st,detail});
  add('st','종목이 2단계인가',stage===2?'pass':'fail','현재 '+stage+'단계');
  add('sl','30주선이 우상향인가',s10>0?'pass':'fail','최근 10주 기울기 '+(s10>=0?'+':'')+s10.toFixed(1)+'%');
  add('bo','최근 4주 안에 저항선을 돌파했나',boLive?'pass':'fail',
    bo?(boLive?bo.weeksAgo+'주 전 돌파, 아직 저항선 위':'돌파는 있었지만 저항선 아래로 되돌림'):'최근 8주 안에 신규 돌파 없음');
  add('vol','돌파 때 거래량이 평균의 2배 이상인가',!hasVol?'unk':(volOk?'pass':(bo?'fail':'unk')),
    !hasVol?'거래량 데이터 없음':(bo&&bo.vr!=null?'돌파 주 거래량 평균 대비 '+bo.vr.toFixed(1)+'배':'비교할 돌파 없음'));
  add('rs','시장보다 강한가(상대강도)',rsNow==null?'unk':(rsNow>0?'pass':'fail'),
    rsNow==null?'시장 지수를 등록하면 계산합니다':'맨스필드 상대강도 '+(rsNow>=0?'+':'')+rsNow.toFixed(2)+(rsUp?' (상승 중)':' (하락 중)'));
  add('hi','위쪽 매물대가 얇은가',distHi<=3?'pass':'fail',distHi<=0?'52주 신고가권':'52주 고점까지 +'+distHi.toFixed(1)+'%');
  add('mk','시장 지수가 상승 단계인가',mktStage==null?'unk':(mktStage===2?'pass':(mktStage===1?'warn':'fail')),
    mktStage==null?'시장 탭에서 지수를 등록하세요':'시장 '+mktStage+'단계');
  add('ex','30주선에서 너무 멀지 않은가',ext<=EXT_OK?'pass':(ext<=EXT_HOT?'warn':'fail'),'30주선 대비 '+(ext>=0?'+':'')+ext.toFixed(1)+'%');
  const score=checks.filter(x=>x.st==='pass').length;
  let sig;
  if(stage===2){
    if(ext>EXT_HOT)sig={k:'hot',t:'보유 · 추격매수 금지',d:'30주선에서 30% 넘게 벌어진 과열 구간입니다. 신규 매수보다 보유분 관리가 먼저입니다.'};
    else if(boLive&&ext<=EXT_OK&&(!hasVol||volOk)&&(rsNow==null||rsNow>0)&&mktStage!==4)
      sig={k:'buy',t:'매수 적기',d:'30주선 위에서 저항선을 거래량과 함께 돌파한 직후입니다. 손절 기준가를 정한 뒤 진입을 검토하세요.'};
    else if(boLive){
      const miss=[];if(hasVol&&!volOk)miss.push('돌파 거래량 부족');if(rsNow!=null&&rsNow<=0)miss.push('상대강도 약함');if(mktStage===4)miss.push('시장 하락 단계');if(ext>EXT_OK)miss.push('30주선과 거리 큼');
      sig={k:'watch',t:'돌파했으나 조건 미충족',d:'미충족: '+(miss.join(', ')||'일부 조건')+'. 조건이 갖춰질 때까지 기다리거나 비중을 줄여 접근합니다.'};
    }
    else if(ext<=EXT_OK)sig={k:'hold',t:'보유 · 눌림목 관찰',d:'2단계 상승이 진행 중이고 30주선과 가깝습니다. 보유분은 유지하고, 30주선 이탈 시 정리합니다.'};
    else sig={k:'hold',t:'보유',d:'상승이 진행 중입니다. 30주선을 지키는 동안 보유하고, 신규 매수는 돌파·눌림 신호를 기다립니다.'};
  }else if(stage===1){
    let pv=-Infinity;for(let j=Math.max(0,last-26);j<=last;j++)if(c[j]>pv)pv=c[j];
    if(c[last]>ma[last]&&c[last]>=pv*0.95)sig={k:'watch',t:'돌파 대기 · 관심종목',d:'바닥 다지기 막바지로 보입니다. 거래량이 실린 저항선 돌파가 나오면 2단계 진입 신호입니다.'};
    else sig={k:'wait',t:'관망',d:'아직 횡보 구간입니다. 사지 않고 돌파를 기다립니다.'};
  }else if(stage===3){
    sig=c[last]<ma[last]?{k:'reduce',t:'30주선 이탈 · 매도 검토',d:'천장권에서 30주선 아래로 내려왔습니다. 보유 중이라면 정리를 검토합니다.'}
      :{k:'reduce',t:'비중 축소 · 이익 확정',d:'상승이 멈추고 30주선이 평평해졌습니다. 신규 매수는 하지 않고 이익을 확정할 준비를 합니다.'};
  }else sig={k:'avoid',t:'매수 금지',d:'30주선 아래에서 하락 중입니다. 싸 보여도 사지 않고, 보유 중이라면 정리를 검토합니다.'};
  return{n,last,price:c[last],date:rows[last].d,ma,maNow:ma[last],stages,stage,s10,s4,ext,weeksAbove,hi52,distHi,bo,fresh,brk,
    stop,stopRef,riskPct,volTrend,hasVol,rsArr,rsNow,rsUp,checks,score,sig,mktStage};
}

/* 예시 데이터 */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gauss(r){return Math.sqrt(-2*Math.log(r()+1e-9))*Math.cos(2*Math.PI*r());}
function genSeries(seed,segs,endTs){
  const r=rng(seed),total=segs.reduce((a,s)=>a+s.n,0),rows=[];let price=segs[0].from,idx=0;
  for(const s of segs){const start=price;
    for(let k=0;k<s.n;k++){
      const base=start+(s.to-start)*((k+1)/s.n)+(s.amp||0)*Math.sin(idx*0.45+seed);
      const c=Math.round(base*(1+gauss(r)*(s.noise||0))*100)/100;
      let v=s.vb*(1+gauss(r)*0.22);v=Math.max(v,s.vb*0.4);if(s.vm&&k===s.n-1)v*=s.vm;
      rows.push({d:endTs-(total-1-idx)*7*DAY,h:Math.round(c*(1.004+r()*0.025)*100)/100,l:Math.round(c*(0.996-r()*0.025)*100)/100,c,v:Math.round(v)});
      idx++;}
    price=s.to;}
  return rows;
}

/* ===== 윌리엄 오닐 · 마크 미너비니 ===== */
function ret52(rows,bench){
  if(!bench)return null;
  const bm=new Map(bench.map(r=>[r.d,r.c])),last=rows.length-1,i0=Math.max(0,last-52);
  const b1=bm.get(rows[last].d),b0=bm.get(rows[i0].d);
  if(!b1||!b0)return null;
  return{s:(rows[last].c/rows[i0].c-1)*100,m:(b1/b0-1)*100};
}
function swingContr(c,last){
  const from=Math.max(2,last-40),seq=[];
  for(let i=from;i<=last-2;i++){
    let mx=-Infinity,mn=Infinity;
    for(let k=-2;k<=2;k++){if(k===0)continue;mx=Math.max(mx,c[i+k]);mn=Math.min(mn,c[i+k]);}
    const isH=c[i]>=mx,isL=c[i]<=mn;
    if(isH===isL)continue;
    const t=isH?'H':'L',p=c[i],q=seq[seq.length-1];
    if(q&&q.t===t){if((t==='H'&&p>q.p)||(t==='L'&&p<q.p)){q.p=p;q.i=i;}}
    else seq.push({i,t,p});
  }
  const depths=[];let lastLow=null;
  for(let k=1;k<seq.length;k++){
    if(seq[k-1].t==='H'&&seq[k].t==='L'){depths.push((seq[k-1].p-seq[k].p)/seq[k-1].p*100);lastLow=seq[k].p;}
  }
  return{depths:depths.slice(-4),lastLow};
}
function volRatio(v,i){
  let s=0,k=0;for(let j=Math.max(0,i-10);j<i;j++){s+=v[j];k++;}
  const a=k?s/k:0;return a>0?v[i]/a:null;
}
function findBase(c,h,l,last){
  const lo0=Math.max(0,last-65);
  let pk=-1,pv=-Infinity;
  for(let i=lo0;i<=last-7;i++)if(c[i]>pv){pv=c[i];pk=i;}
  if(pk>=0){
    let lw=-1,lv=Infinity;
    for(let i=pk+1;i<=last;i++)if(c[i]<lv){lv=c[i];lw=i;}
    const depth=(pv-lv)/pv*100;
    if(lw>pk&&depth>=12&&depth<=35&&lw-pk>=3&&last-lw>=3&&c[last]>=pv*0.85){
      let piv=-Infinity;for(let j=pk;j<=last-1;j++)piv=Math.max(piv,h[j]);
      let ml=Infinity;for(let j=Math.max(lw,last-3);j<=last-1;j++)ml=Math.min(ml,l[j]);
      const handle=isFinite(ml)?(piv-ml)/piv*100:0;
      if(handle<=12)return{type:'컵·핸들',pivot:piv,depth,len:last-pk,handle};
    }
  }
  for(let k=12;k>=5;k--){
    const a=last-k;if(a<1)continue;
    let hi=-Infinity,lo=Infinity;
    for(let j=a;j<=last-1;j++){hi=Math.max(hi,h[j]);lo=Math.min(lo,l[j]);}
    const depth=(hi-lo)/hi*100;
    if(depth>15)continue;
    let pl=Infinity;for(let j=Math.max(0,a-26);j<a;j++)pl=Math.min(pl,c[j]);
    if(isFinite(pl)&&c[a-1]/pl>=1.3)return{type:'플랫 베이스',pivot:hi,depth,len:k,handle:null};
  }
  return null;
}
function trendCore(rows){
  const n=rows.length,c=rows.map(r=>r.c),h=rows.map(r=>r.h||r.c),l=rows.map(r=>r.l||r.c),v=rows.map(r=>r.v);
  const m10=sma(c,10),m30=sma(c,30),m40=sma(c,40),last=n-1,P=c[last];
  let hi52=-Infinity,lo52=Infinity;
  for(let j=Math.max(0,last-51);j<=last;j++){hi52=Math.max(hi52,h[j]);lo52=Math.min(lo52,l[j]);}
  return{n,c,h,l,v,m10,m30,m40,last,P,hi52,lo52,fromLow:(P/lo52-1)*100,offHigh:(1-P/hi52)*100,
    hasVol:v.filter(x=>x>0).length>n*0.5};
}
function analyzeMinervini(rows,bench,mktStage){
  if(!rows||rows.length<52)return{err:'주봉 52개 이상이 필요합니다.'};
  const T=trendCore(rows),{c,h,l,v,m10,m30,m40,last,P,hasVol}=T;
  const checks=[],add=(label,st,detail)=>checks.push({label,st,detail});
  const r52=ret52(rows,bench);
  add('주가가 30주선과 40주선 위인가',P>m30[last]&&P>m40[last]?'pass':'fail','30주선 '+fmtP(m30[last])+' · 40주선 '+fmtP(m40[last]));
  add('30주선이 40주선 위인가',m30[last]>m40[last]?'pass':'fail','150일선이 200일선 위');
  const up4=m40[last]>m40[last-4],up22=last>=62?m40[last]>m40[last-22]:null;
  add('40주선이 상승 중인가',up4?'pass':'fail','4주 전 대비 '+((m40[last]/m40[last-4]-1)*100).toFixed(1)+'%'+(up22==null?'':' · 22주 전 대비 '+((m40[last]/m40[last-22]-1)*100).toFixed(1)+'%'));
  add('10주선 > 30주선 > 40주선인가',m10[last]>m30[last]&&m30[last]>m40[last]?'pass':'fail','50일선 > 150일선 > 200일선 정배열');
  add('주가가 10주선 위인가',P>m10[last]?'pass':'fail','10주선 '+fmtP(m10[last]));
  add('52주 저점보다 30% 이상 위인가',T.fromLow>=30?'pass':'fail','저점 대비 +'+T.fromLow.toFixed(0)+'%');
  add('52주 고점에서 25% 이내인가',T.offHigh<=25?'pass':'fail','고점 대비 -'+T.offHigh.toFixed(1)+'%');
  add('상대강도가 높은가(시장 대비 52주 수익률)',r52==null?'unk':(r52.s>r52.m?'pass':'fail'),r52==null?'시장 지수를 등록하면 계산합니다':'종목 '+fmtPct(r52.s)+' · 시장 '+fmtPct(r52.m)+' (상위 30% 순위 대신 시장 초과 여부로 대체)');
  const tt=checks.filter(x=>x.st==='pass').length;
  const trendPass=checks.slice(0,7).every(x=>x.st==='pass')&&checks[7].st!=='fail';
  const sc=swingContr(c,last),d=sc.depths,nd=d.length;
  const vcp=nd>=2&&d[nd-1]<d[nd-2]&&d[nd-1]<=12;
  let pivot=-Infinity;for(let j=Math.max(0,last-30);j<=last-1;j++)pivot=Math.max(pivot,h[j]);
  const dist=(P/pivot-1)*100;

function builtinUniverse(){

function getUniverse(){return state.universe&&state.universe.length?state.universe:builtinUniverse();}
function parseUniverse(text){

    const m=line.match(/(?:^|[^0-9A-Za-z])([0-9][0-9A-Z]{5})(?![0-9A-Za-z])/);
    if(!m)return;
    const code=m[1];if(seen.has(code)||!isCommon(code))return;
    const name=line.replace(code,' ').replace(/[\t,;|]+/g,' ').replace(/\s+/g,' ').trim();
    seen.add(code);out.push([code,name]);

}
async function fetchUniverseOnline(){

  for(const mk of ['KOSPI','KOSDAQ']){
    for(let pg=1;pg<=40;pg++){
      let j;
      try{const r=await fetch('https://m.stock.naver.com/api/stocks/marketValue/'+mk+'?page='+pg+'&pageSize=100');if(!r.ok)throw new Error('HTTP '+r.status);j=await r.json();}
      catch(e){err=e.message||'실패';break;}
      const arr=Array.isArray(j)?j:(j.stocks||j.items||j.result||[]);
      if(!arr.length)break;
      let added=0;
      arr.forEach(x=>{const cd=String(x.itemCode||x.code||x.stockCode||''),nm=String(x.stockName||x.name||'');
        if(!/^[0-9][0-9A-Z]{5}$/.test(cd)||seen.has(cd)||!isCommon(cd)||/스팩|제\d+호/.test(nm))return;seen.add(cd);out.push([cd,nm]);added++;});
      if(!added&&pg>1)break;

  return out;
}
function compactEval(code,name,rows,bench,msW,msO,msM){

  return{c:code,n:name,p:a.price,w:[a.stage,a.sig.k,a.score,a.rsNow==null?0:Math.round(a.rsNow*100)/100],
    o:[b.sig.k,b.score,b.total,b.dist==null?null:Math.round(b.dist*10)/10],m:[c.sig.k,c.score,c.total,c.dist==null?null:Math.round(c.dist*10)/10]};

function evalAll(){

  state.stocks.forEach(s=>{

    if(!a||a.err||!b||b.err||!c||c.err)return;
    map.set(s.code,{c:s.c||s.code,n:s.name,p:a.price,id:s.id,d:[a.sig.d,b.sig.d,c.sig.d],w:[a.stage,a.sig.k,a.score,a.rsNow==null?0:a.rsNow],o:[b.sig.k,b.score,b.total,b.dist],m:[c.sig.k,c.score,c.total,c.dist]});

const norm=e=>e.w[2]/8+e.o[1]/(e.o[2]||7)+e.m[1]/(e.m[2]||8);
function posOf(e){return{w:e.w[0]===2&&POS.includes(e.w[1]),o:POS.includes(e.o[0]),m:POS.includes(e.m[0])};}
function strongN(e){return (e.w[0]===2&&STRONG.includes(e.w[1])?1:0)+(STRONG.includes(e.o[0])?1:0)+(STRONG.includes(e.m[0])?1:0);}
function topOf(list,ex){
  const r={w:e=>SIGORD[e.w[1]],o:e=>SIGORD[e.o[0]],m:e=>SIGORD[e.m[0]]}[ex];
  const f=ex==='w'?(e=>e.w[0]===2&&POS.includes(e.w[1])):ex==='o'?(e=>POS.includes(e.o[0])):(e=>POS.includes(e.m[0]));

function sparkSVG(rows,A){
  const N=Math.min(52,rows.length),off=rows.length-N,pts=rows.slice(off).map(r=>r.c);
  const mn=Math.min(...pts),mx=Math.max(...pts),w=44,h=22;
  const d=pts.map((p,i)=>(i*(w/(N-1))).toFixed(1)+','+(h-2-(p-mn)/(mx-mn||1)*(h-4)).toFixed(1)).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${d}" fill="none" stroke="var(--c)" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}

const normQ=t=>String(t||'').toLowerCase().replace(/[\s.\-_()]/g,'');
function localMatches(q){
  const n=normQ(q);if(!n)return [];
  if(/^[0-9a-z]{6}$/i.test(q.trim())&&/\d/.test(q))return [];
  const pool=[...state.stocks.filter(s=>s.code).map(s=>({name:s.name,code:s.code})),...state.cands.map(c=>({name:c.name,code:c.code})),...STOCKDB];
  const seen=new Set(),ex=[],st=[],inc=[];
  for(const it of pool){
    const k=it.code;if(seen.has(k))continue;
    const m=normQ(it.name);
    if(m===n){ex.push(it);seen.add(k);}else if(m.startsWith(n)){st.push(it);seen.add(k);}else if(m.includes(n)){inc.push(it);seen.add(k);}
  }
  return [...ex,...st,...inc].slice(0,6);
}
async function remoteMatches(q){
  const out=[],ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),4000);
  try{
    const r=await fetch('https://ac.stock.naver.com/ac?q='+encodeURIComponent(q)+'&target=stock',{signal:ctl.signal});
    const j=await r.json();
    const walk=(v)=>{
      if(!v)return;
      if(Array.isArray(v)){
        const flat=v.flat(3).filter(x=>typeof x==='string');
        const cd=flat.find(x=>/^\d[0-9A-Z]{5}$/.test(x));
        if(cd&&flat.length>1&&v.every(x=>typeof x==='string'||(Array.isArray(x)&&x.every(y=>typeof y==='string')))){const nm=flat.find(x=>x!==cd&&!/^\d+$/.test(x)&&!/^(KOSPI|KOSDAQ|KONEX|stock|domestic)$/i.test(x));if(nm)out.push({name:nm,code:cd});return;}
        v.forEach(walk);
      }else if(typeof v==='object'){
        const cd=v.code||v.itemCode||v.cd,nm=v.name||v.itemName||v.nm;
        if(cd&&nm&&/^\d[0-9A-Z]{5}$/.test(String(cd))){out.push({name:String(nm),code:String(cd)});return;}
        Object.values(v).forEach(walk);
      }
    };
    walk(j.items||j);
  }catch(e){}finally{clearTimeout(tm);}
  const seen=new Set();return out.filter(x=>seen.has(x.code)?false:(seen.add(x.code),true)).slice(0,6);
}
async function resolveName(q){
  const loc=localMatches(q),n=normQ(q);
  const ex=loc.find(x=>normQ(x.name)===n);if(ex)return ex;
  if(loc.length===1)return loc[0];
  const rem=await remoteMatches(q);
  const rx=rem.find(x=>normQ(x.name)===n);if(rx)return rx;
  if(rem.length===1)return rem[0];
  return loc[0]||rem[0]||null;
}

const MODES=['h:x-app-secret','h:x-shared-secret','h:x-api-key','b:','q:secret','q:key','q:appSecret','n:'];
function buildReq(path,mode){
  const c=state.conn,base=c.url.trim().replace(/\/+$/,'');
  let url=base+path;const headers={};
  const parts=String(mode||'n:').split(':'),t=parts[0],name=parts.slice(1).join(':');
  if(t==='h'&&c.secret&&name)headers[name]=c.secret;
  else if(t==='b'&&c.secret)headers['Authorization']='Bearer '+c.secret;
  else if(t==='q'&&c.secret&&name)url+=(url.includes('?')?'&':'?')+encodeURIComponent(name)+'='+encodeURIComponent(c.secret);
  return {url,headers};
}
async function httpJSON(path,mode,timeoutMs){
  const {url,headers}=buildReq(path,mode);
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),timeoutMs||70000);
  try{
    const r=await fetch(url,{headers,signal:ctl.signal});
    const txt=await r.text();
    let j=null;try{j=JSON.parse(txt);}catch(e){}
    if(!r.ok){const e=new Error('HTTP '+r.status+(j&&j.error?' '+j.error:''));e.status=r.status;throw e;}
    if(j==null)throw new Error('JSON이 아닌 응답입니다.');
    return j;
  }finally{clearTimeout(tm);}
}

  const path='/stock-history/'+encodeURIComponent(code)+'?period=W&days='+(daysOv||c.days||1100);

async function testConn(){
  if(state.busy)return;
  const c=state.conn;
  c.url=$('#c-url').value.trim();c.secret=$('#c-secret').value.trim();c.mktCode=$('#c-mkt').value.trim()||'069500';
  const d=parseInt(String($('#c-days').value).replace(/\D/g,''),10);c.days=d>0?Math.min(d,3000):1100;
  c.auto=$('#c-auto').checked;c.autoStocks=$('#c-autos').checked;
  const custom=$('#c-mode').value.trim();
  save();
  if(!c.url||!c.secret){connMsg='서버 주소와 비밀키를 입력하세요.';render();return;}
  const modes=[custom,...MODES].filter((m,i,a)=>m&&a.indexOf(m)===i);
  const path='/stock-history/005930?period=W&days='+Math.min(c.days,700);
  const log=[];connMsg='';refreshErr='';
  for(let i=0;i<modes.length;i++){
    const m=modes[i];
    state.busy='연결 테스트 중 ('+(i+1)+'/'+modes.length+') · 서버가 잠들어 있으면 1분 가까이 걸릴 수 있습니다.';render();
    let j;
    try{j=await httpJSON(path,m,i===0?70000:25000);}
    catch(e){log.push(m+' → '+(e.name==='AbortError'?'시간 초과':(e instanceof TypeError?'연결 실패':(e.message||'실패'))));continue;}
    c.mode=m;save();
    try{
      const rows=normHistory(j),L=rows[rows.length-1];
      log.unshift('성공: 비밀키 전달 방식 '+m,'주봉 '+rows.length+'개 ('+fmtDate(rows[0].d)+' ~ '+fmtDate(L.d)+')','마지막 종가 '+fmtP(L.c)+(L.v?', 거래량 '+Math.round(L.v).toLocaleString('ko-KR'):', 거래량 없음'));
    }catch(e){
      log.unshift('서버는 응답했지만 시세 형식을 읽지 못했습니다: '+e.message,'전달 방식 '+m+' 저장됨','응답 앞부분:',JSON.stringify(j).slice(0,500));
    }
    state.busy='';connMsg=log.join('\n');render();return;
  }
  state.busy='';
  connMsg=log.join('\n')+'\n\n모든 방식이 실패했습니다. 주소와 비밀키를 확인하고, 서버가 비밀키를 읽는 방식(APP_SHARED_SECRET 검색 결과)을 알려 주세요.';
  render();
}
async function refreshOne(s){
  const r=await fetchWeekly(s.code);

}
async function refreshAll(silent,boot){
  if(state.busy)return;
  const list=(boot&&!state.conn.autoStocks)?[]:(boot?state.stocks:exStocks()).filter(s=>s.code&&!s.ex),hasMk=state.market&&state.market.code&&!state.market.ex;
  const mkCode=hasMk?state.market.code:(boot&&state.conn.mktCode?state.conn.mktCode:''),mk=!!mkCode;
  const total=list.length+(mk?1:0);
  if(!total){if(!silent){refreshErr='종목코드가 있는 종목이 없습니다. 종목을 코드로 추가하세요.';render();}return;}
  if(!state.conn.url||!state.conn.secret){if(!silent){refreshErr='연결 탭에서 서버 주소와 비밀키를 먼저 입력하세요.';render();}return;}
  const errs=[];let i=0;refreshErr='';
  const step=async(fn,label)=>{i++;state.busy='시세 조회 중 '+i+'/'+total+' · '+label;if(state.tab==='stocks'&&!state.sel&&!state.form)render();
    try{await fn();}catch(e){errs.push(label+': '+e.message);}};
  if(mk)await step(async()=>{const r=await fetchWeekly(mkCode);if(hasMk)state.market.rows=r.rows;else state.market={name:'시장 ('+mkCode+')',code:mkCode,rows:r.rows};},hasMk?state.market.name:'시장 ('+mkCode+')');
  for(const s of list)await step(()=>refreshOne(s),s.name);
  state.busy='';state.lastRefresh=Date.now();refreshErr=errs.slice(0,4).join(' / ');
  save();recompute();render();
}
async function fetchMarket(){
  if(state.busy)return;
  const code=(state.conn.mktCode||'069500');
  state.busy='시장 지수 조회 중…';refreshErr='';render();
  try{
    const r=await fetchWeekly(code);
    const keep=state.market&&state.market.code===code&&!state.market.ex;
    state.market={name:keep?state.market.name:'시장 ('+code+')',code,rows:r.rows};save();
  }catch(e){refreshErr=e.message;}
  state.busy='';recompute();render();
}
async function saveBulk(){

function candChecks(c,A){
  const mk=cache.mkt&&!cache.mkt.err?cache.mkt:null,ck=[];
  const add=(label,st,detail)=>ck.push({label,st,detail});
  add('위쪽 매물대가 없는가','pass',c.hi+' 신고가권');
  add('상대강도가 높은가','pass','상대강도 '+c.rs+' (외부 지표, 70 이상 선별)');
  add('돌파 때 거래량이 평균의 2배 이상인가',c.vol>=2?'pass':'fail','거래량 '+c.vol.toFixed(1)+'배');
  add('단기 과열이 아닌가',c.d5>=10?'warn':'pass','5일 '+fmtPct(c.d5)+(c.d5>=10?' · 30주선과 거리 확인 필요':''));
  if(A&&!A.err)add('30주선 위 2단계인가',A.stage===2?'pass':'fail','앱 판정 '+A.stage+'단계 · 30주선 대비 '+fmtPct(A.ext)+' · 기울기 '+fmtPct(A.s10));
  else add('30주선 위 2단계인가','unk','앱에서 분석하면 계산합니다');
  add('시장 지수가 상승 단계인가',mk?(mk.stage===2?'pass':mk.stage===1?'warn':'fail'):'unk',mk?'시장 '+mk.stage+'단계'+(mk.stage>=3?' · 신규 매수 보류 구간':''):'시장 탭에서 지수를 등록하세요');
  return ck;

async function addCodes(codes,tab){

async function addCandidate(code){

const NV=130;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function setup(cv){const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);return{g,W,H};}
function drawMain(){
  const cv=$('#c-main');if(!cv||!view)return;
  const {rows,A}=view,{g,W,H}=setup(cv);
  const N=Math.min(rows.length,NV),off=rows.length-N;
  const padL=4,padR=44,padT=10,padB=20,volH=H*0.2,gap=6;
  const plotW=W-padL-padR,plotH=H-padT-padB-volH-gap,step=plotW/N;
  let mn=Infinity,mx=-Infinity;
  for(let i=0;i<N;i++){const k=off+i;mn=Math.min(mn,rows[k].c,A.ma[k]??Infinity);mx=Math.max(mx,rows[k].c,A.ma[k]??-Infinity);}
  const pad=(mx-mn)*0.06||1;mn-=pad;mx+=pad;
  const X=i=>padL+(i+0.5)*step,Y=p=>padT+(1-(p-mn)/(mx-mn))*plotH;
  const ink=tok('--ink'),muted=tok('--muted'),line=tok('--line'),ma=tok('--ma');
  const sc={1:tok('--s1'),2:tok('--s2'),3:tok('--s3'),4:tok('--s4')};
  g.clearRect(0,0,W,H);
  for(let i=0;i<N;i++){const s=A.stages[off+i];if(!s)continue;g.globalAlpha=0.13;g.fillStyle=sc[s];g.fillRect(padL+i*step,padT,step+0.5,plotH+gap+volH);}
  g.globalAlpha=1;
  g.font='11px '+tok('--font-mono');g.textBaseline='middle';g.fillStyle=muted;g.strokeStyle=line;g.lineWidth=1;
  for(let t=0;t<=4;t++){const p=mn+(mx-mn)*t/4,y=Y(p);g.beginPath();g.moveTo(padL,y);g.lineTo(W-padR,y);g.stroke();g.fillText(fmtP(p),W-padR+4,y);}
  let mv=0;for(let i=0;i<N;i++)mv=Math.max(mv,rows[off+i].v);
  const vb=H-padB;
  if(mv>0)for(let i=0;i<N;i++){const k=off+i,h=rows[k].v/mv*volH,isb=A.fresh[k];g.globalAlpha=isb?0.9:0.35;g.fillStyle=isb?sc[2]:muted;g.fillRect(padL+i*step+step*0.15,vb-h,step*0.7,h);}
  g.globalAlpha=1;
  g.lineJoin='round';g.lineWidth=1.8;g.strokeStyle=ma;g.beginPath();let st=false;
  for(let i=0;i<N;i++){const m=A.ma[off+i];if(m==null)continue;if(!st){g.moveTo(X(i),Y(m));st=true;}else g.lineTo(X(i),Y(m));}g.stroke();
  g.lineWidth=1.6;g.strokeStyle=ink;g.beginPath();
  for(let i=0;i<N;i++){const y=Y(rows[off+i].c);i?g.lineTo(X(i),y):g.moveTo(X(i),y);}g.stroke();
  g.fillStyle=sc[2];
  for(let i=0;i<N;i++){if(!A.fresh[off+i])continue;const x=X(i),y=Y(rows[off+i].c)+9;g.beginPath();g.moveTo(x,y-6);g.lineTo(x-5,y+3);g.lineTo(x+5,y+3);g.closePath();g.fill();}
  const ly=Y(rows[rows.length-1].c);g.fillStyle=ink;g.beginPath();g.arc(X(N-1),ly,3.2,0,7);g.fill();
  g.fillStyle=muted;g.textBaseline='alphabetic';g.textAlign='center';
  for(let t=0;t<4;t++){const i=Math.round((N-1)*t/3),d=new Date(rows[off+i].d);g.fillText(d.getUTCFullYear()+'.'+String(d.getUTCMonth()+1).padStart(2,'0'),Math.min(Math.max(X(i),26),W-padR-10),H-5);}
  g.textAlign='left';
  if(hoverI!=null){const x=X(hoverI),k=off+hoverI;g.strokeStyle=muted;g.setLineDash([3,3]);g.beginPath();g.moveTo(x,padT);g.lineTo(x,vb);g.stroke();g.setLineDash([]);
    g.fillStyle=ink;g.beginPath();g.arc(x,Y(rows[k].c),3.5,0,7);g.fill();
    const tip=$('#tip');if(tip){const r=rows[k];tip.style.display='block';tip.textContent=fmtDate(r.d)+'  종가 '+fmtP(r.c)+(A.ma[k]?'  30주선 '+fmtP(A.ma[k]):'')+(r.v?'  거래량 '+Math.round(r.v).toLocaleString('ko-KR'):'')+(A.stages[k]?'  '+A.stages[k]+'단계':'');}}
  else{const tip=$('#tip');if(tip)tip.style.display='none';}
}
function drawRS(){
  const cv=$('#c-rs');if(!cv||!view)return;
  const {rows,A}=view,{g,W,H}=setup(cv),N=Math.min(rows.length,NV),off=rows.length-N;
  const padL=4,padR=44,padT=8,padB=8,plotW=W-padL-padR,plotH=H-padT-padB,step=plotW/N;
  let mn=0,mx=0;for(let i=0;i<N;i++){const v=A.rsArr[off+i];if(v!=null){mn=Math.min(mn,v);mx=Math.max(mx,v);}}
  const pad=(mx-mn)*0.1||0.5;mn-=pad;mx+=pad;
  const X=i=>padL+(i+0.5)*step,Y=v=>padT+(1-(v-mn)/(mx-mn))*plotH;
  const line=tok('--line'),muted=tok('--muted'),acc=tok('--accent');
  g.clearRect(0,0,W,H);g.strokeStyle=muted;g.lineWidth=1;g.setLineDash([4,3]);g.beginPath();g.moveTo(padL,Y(0));g.lineTo(W-padR,Y(0));g.stroke();g.setLineDash([]);
  g.strokeStyle=acc;g.lineWidth=1.8;g.lineJoin='round';g.beginPath();let st=false;
  for(let i=0;i<N;i++){const v=A.rsArr[off+i];if(v==null)continue;if(!st){g.moveTo(X(i),Y(v));st=true;}else g.lineTo(X(i),Y(v));}g.stroke();
  g.font='11px '+tok('--font-mono');g.fillStyle=muted;g.textBaseline='middle';g.fillText('0',W-padR+4,Y(0));
  if(A.rsNow!=null){g.fillStyle=acc;g.fillText((A.rsNow>=0?'+':'')+A.rsNow.toFixed(2),W-padR+4,Y(A.rsNow));}
}
function drawAll(){drawMain();drawRS();bindChart();}
function bindChart(){
  const cv=$('#c-main');if(!cv)return;
  const mv=e=>{const r=cv.getBoundingClientRect(),N=Math.min(view.rows.length,NV),plotW=r.width-48,i=Math.floor((e.clientX-r.left-4)/(plotW/N));hoverI=Math.max(0,Math.min(N-1,i));drawMain();};
  cv.addEventListener('pointermove',mv);cv.addEventListener('pointerdown',mv);
  cv.addEventListener('pointerleave',()=>{hoverI=null;drawMain();});
}

async function saveForm(){
  const f=state.form;
  if(f.mode==='bulk')return saveBulk();
  if(state.busy)return;
  let name=$('#f-name').value.trim(),text=$('#f-data').value;
  let code=($('#f-code').value||'').trim().toUpperCase();
  const file=$('#f-file').files[0],btn=$('[data-act="save-form"]');
  try{
    if(!code&&name&&!text.trim()&&!file&&f.mode==='stock'&&!f.id){
      if(btn){btn.disabled=true;btn.textContent='종목 찾는 중…';}
      const hit=await resolveName(name);
      if(!hit)throw new Error('"'+name+'" 종목을 찾지 못했습니다. 정확한 이름이나 6자리 코드를 입력하세요.');
      code=hit.code.toUpperCase();name=hit.name;
    }
    if(!text.trim()&&file)text=await readFile(file);
    const cur=f.id?state.stocks.find(x=>x.id===f.id):(f.mode==='market'?state.market:null);
    let rows=null,apiName='';
    if(text.trim())rows=parseInput(text);
    else if(code){
      if(btn){btn.disabled=true;btn.textContent='조회 중…';}
      const r=await fetchWeekly(code);rows=r.rows;apiName=r.name;
    }else if(!cur)throw new Error('가격 데이터를 붙여넣거나 종목코드를 입력하세요.');
    if(!name)name=apiName||code;
    if(!name)throw new Error('이름을 입력하세요.');
    if(f.mode==='market')state.market={name,code:code||(cur&&cur.code)||'',rows:rows||cur.rows};
    else if(f.id){const s=state.stocks.find(x=>x.id===f.id);s.name=name;s.code=code||s.code||'';if(rows)s.rows=rows;s.ex=false;}
    else{const TG=f.all?['wein','oneil','mn']:[state.expert];let st=code&&state.stocks.find(x=>x.code===code);if(st&&rows)st.rows=rows;if(!st){st={id:uid(),name,code,rows,m:[]};state.stocks.push(st);}if(!st.m)st.m=['wein'];TG.forEach(k=>{if(!st.m.includes(k))st.m.push(k);});}
    save();recompute();state.form=null;formErr='';refreshErr='';
    if(f.mode==='market'){state.tab='market';}else{state.tab='stocks';if(!f.id&&!f.all&&state.expert==='wein'){const ls=exStocks('wein');state.sel=ls[ls.length-1].id;}}
    render();window.scrollTo(0,0);
  }catch(err){formErr=err.message||'저장하지 못했습니다.';
    const n=$('#f-name').value,d=$('#f-data').value,cd=$('#f-code').value;render();$('#f-name').value=n;$('#f-data').value=d;$('#f-code').value=cd;}
}
document.addEventListener('input',e=>{
  if(e.target.id==='f-name'&&state.form&&state.form.mode==='stock')onNameInput();
  if(e.target.id==='f-code'){e.target.dataset.auto='';}
  if(e.target.id==='cap'){const v=parseNum(e.target.value);state.settings.capital=isNaN(v)?0:v;save();if(view)$('#calc-out').innerHTML=calcHTML(view.A);}
  if(e.target.id==='risk'){const v=parseNum(e.target.value);state.settings.riskPct=isNaN(v)?0:v;save();if(view)$('#calc-out').innerHTML=calcHTML(view.A);}
});
document.addEventListener('change',async e=>{
  if(e.target.id==='f-file'&&e.target.files[0]){try{$('#f-data').value=await readFile(e.target.files[0]);}catch(err){formErr=err.message;}}
});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(drawAll,120);});
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>drawAll());}catch(e){}
new MutationObserver(()=>drawAll()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

load();syncCands();save();
state.stocks=state.stocks.filter(s=>!s.ex);if(state.market&&state.market.ex)state.market=null;save();
recompute();render();
if(state.conn.auto&&state.conn.url&&state.conn.secret)refreshAll(true,true);
</script>
</body>
</html>
